services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dubl
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: dubl
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U dubl"]
      interval: 5s
      retries: 12
    restart: unless-stopped
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://dubl:${POSTGRES_PASSWORD}@db:5432/dubl
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      UPLOAD_DIR: /app/uploads
    volumes: [uploads:/app/uploads]
    depends_on:
      db: { condition: service_healthy }
    command:
      [
        sh,
        -c,
        "alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-proxy-headers",
      ]
    restart: unless-stopped
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_ORIGIN:-http://localhost:8080}
        SITE_URL: ${SITE_URL:-http://localhost:8080}
    environment:
      SITE_URL: ${SITE_URL:-http://localhost:8080}
    depends_on: [backend]
    restart: unless-stopped
  nginx:
    image: nginx:stable-alpine
    ports: ["8080:80"]
    volumes: ["./infra/nginx.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [frontend, backend]
    restart: unless-stopped
volumes:
  postgres:
  uploads:
