limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
server {
 listen 80;
 server_tokens off;
 client_max_body_size 9m;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 location = /api/admin/login { limit_req zone=login burst=5 nodelay; proxy_pass http://backend:8000; proxy_set_header Host $host; }
 location /api/ { proxy_pass http://backend:8000; proxy_set_header Host $host; }
 location /uploads/ { proxy_pass http://backend:8000; expires 30d; }
 location / { proxy_pass http://frontend:80; proxy_set_header Host $host; }
}
