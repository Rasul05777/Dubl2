# Replace example.com and provision certificates before enabling this configuration.
server { listen 80; server_name example.com; return 301 https://$host$request_uri; }
server {
 listen 443 ssl;
 server_name example.com;
 ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 client_max_body_size 9m;
 add_header Strict-Transport-Security "max-age=31536000" always;
 add_header X-Content-Type-Options nosniff always;
 location /api/ { proxy_pass http://backend:8000; }
 location /uploads/ { proxy_pass http://backend:8000; expires 30d; }
 location / { proxy_pass http://frontend:80; proxy_set_header Host $host; }
}
